[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-iot-ids"
version = "1.0.0"
description = "Federated Learning IDS for IoT Edge Nodes"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.30.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
]

[tool.flwr.app]
publisher = "cnit-pntlab"

[tool.flwr.app.components]
serverapp = "src.server_app:app"
clientapp = "src.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 1.0
learning-rate = 0.001
num-partitions = 10



