services:
  # Long-running communication-timing daemon -- starts first, listens
  # for client submissions over the real Docker network for the
  # duration of the run, then exits automatically once it has received
  # NUM_REAL_CLIENTS x ROUNDS submissions (see server_daemon.py).
  server:
    build: .
    command: server_daemon.py
    environment:
      OUT_DIR: /data/results/${RUN_TAG}
      NUM_REAL_CLIENTS: "2"
      ROUNDS: ${ROUNDS:-3}
      PORT: "8080"
    volumes:
      - ./results:/data/results
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('localhost',8080),timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15

  client0:
    build: .
    command: client_runner.py
    depends_on:
      server:
        condition: service_healthy
    environment:
      CLIENT_ID: "0"
      MODE: ${MODE}
      MODEL_TYPE: ${MODEL_TYPE}
      PARTITION_DIR: /data/partitions/${MODEL_TYPE}
      OUT_DIR: /data/results/${RUN_TAG}
      EPOCHS: ${EPOCHS:-2}
      ROUNDS: ${ROUNDS:-3}
      HE_POLY_DEGREE: ${HE_POLY_DEGREE:-4096}
      DP_EPSILON: ${DP_EPSILON:-3.0}
      DP_MAX_GRAD_NORM: ${DP_MAX_GRAD_NORM:-1.0}
      DP_BATCH_SIZE: ${DP_BATCH_SIZE:-512}
      SERVER_PORT: "8080"
    volumes:
      - ./partitions:/data/partitions:ro
      - ./results:/data/results
    mem_limit: 2g
    cpus: 1.0

  client1:
    build: .
    command: client_runner.py
    depends_on:
      server:
        condition: service_healthy
    environment:
      CLIENT_ID: "1"
      MODE: ${MODE}
      MODEL_TYPE: ${MODEL_TYPE}
      PARTITION_DIR: /data/partitions/${MODEL_TYPE}
      OUT_DIR: /data/results/${RUN_TAG}
      EPOCHS: ${EPOCHS:-2}
      ROUNDS: ${ROUNDS:-3}
      HE_POLY_DEGREE: ${HE_POLY_DEGREE:-4096}
      DP_EPSILON: ${DP_EPSILON:-3.0}
      DP_MAX_GRAD_NORM: ${DP_MAX_GRAD_NORM:-1.0}
      DP_BATCH_SIZE: ${DP_BATCH_SIZE:-512}
      SERVER_PORT: "8080"
    volumes:
      - ./partitions:/data/partitions:ro
      - ./results:/data/results
    mem_limit: 2g
    cpus: 1.0

  # One-shot AGGREGATION timing step (Krum / HE-aggregate+decrypt / ZKP
  # verify+threshold) -- run separately, AFTER client0/client1/server
  # have all finished and written their artifacts to the shared volume.
  # Not part of the concurrent communication test above.
  aggregator:
    build: .
    command: server_aggregate.py
    environment:
      MODE: ${MODE}
      OUT_DIR: /data/results/${RUN_TAG}
      ROUNDS: ${ROUNDS:-3}
      HE_POLY_DEGREE: ${HE_POLY_DEGREE:-4096}
      NUM_REAL_CLIENTS: "2"
      SYNTHETIC_N_CLIENTS: ${SYNTHETIC_N_CLIENTS:-10}
      NUM_BYZANTINE_ASSUMED: ${NUM_BYZANTINE_ASSUMED:-2}
    volumes:
      - ./results:/data/results
    mem_limit: 2g
    cpus: 1.0
    profiles: ["aggregate"]
