      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/he_partial:/results
      - ../../datasets/partitions:/datasets/partitions:ro
    depends_on:
      - fl_server_he_partial
    mem_limit: 500m
    memswap_limit: 500m
    cpus: "1.0"

  fl_client_he_partial_1:
    profiles: ["he_partial"]
    image: fl-ids:latest
    container_name: fl_client_he_partial_1
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "1"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_he_partial:5000"
      USE_LOCAL_DP: "false"
      USE_ZKP: "false"
      USE_HE: "true"
      HE_FULL_COVERAGE: "false"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
