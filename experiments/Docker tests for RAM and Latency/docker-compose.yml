      MODEL_TYPE: "network"
      NUM_FEATURES: "38"
    ports:
      - "5004:5000"
    volumes:
      - ./results/he_partial:/results
    mem_limit: 2g

  fl_client_he_partial_0:
    profiles: ["he_partial"]
    image: fl-ids:latest
    container_name: fl_client_he_partial_0
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "0"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_he_partial:5000"
      USE_LOCAL_DP: "false"
