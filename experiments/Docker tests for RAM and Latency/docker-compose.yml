version: "3.8"

services:

  # ══════════════════════════════════════════════════════════════════
  # PURE HE (original ablation): partial coverage, DP/ZKP off
  # ══════════════════════════════════════════════════════════════════

  fl_server_he:
    profiles: ["pure_he"]
    build: .
    image: fl-ids:latest
    container_name: fl_server_he
    command: ["python", "server.py"]
    environment:
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      USE_HE: "true"
      MODEL_TYPE: "network"
    ports:
      - "5001:5000"
    volumes:
      - ./results/pure_he:/results
    mem_limit: 2g

  fl_client_he_0:
    profiles: ["pure_he"]
    image: fl-ids:latest
    container_name: fl_client_he_0
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "0"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_he:5000"
      USE_LOCAL_DP: "false"
      USE_ZKP: "false"
      USE_HE: "true"
      HE_FULL_COVERAGE: "true"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/pure_he:/results
      - ../datasets/partitions:/datasets/partitions:ro
    depends_on:
      - fl_server_he
    mem_limit: 700m
    memswap_limit: 700m
    cpus: "1.0"

  fl_client_he_1:
    profiles: ["pure_he"]
    image: fl-ids:latest
    container_name: fl_client_he_1
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "1"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_he:5000"
      USE_LOCAL_DP: "false"
      USE_ZKP: "false"
      USE_HE: "true"
      HE_FULL_COVERAGE: "true"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/pure_he:/results
      - ../datasets/partitions:/datasets/partitions:ro
    depends_on:
      - fl_server_he
    mem_limit: 700m
    memswap_limit: 700m
    cpus: "1.0"

  # ══════════════════════════════════════════════════════════════════
  # PURE DP: 100% of model DP-noised, HE+ZKP off
  # ══════════════════════════════════════════════════════════════════

  fl_server_dp:
    profiles: ["pure_dp"]
    build: .
    image: fl-ids:latest
    container_name: fl_server_dp
    command: ["python", "server.py"]
    environment:
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      USE_HE: "false"
      MODEL_TYPE: "network"
    ports:
      - "5002:5000"
    volumes:
      - ./results/pure_dp:/results
    mem_limit: 6g

  fl_client_dp_0:
    profiles: ["pure_dp"]
    image: fl-ids:latest
    container_name: fl_client_dp_0
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "0"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_dp:5000"
      USE_LOCAL_DP: "true"
      USE_ZKP: "false"
      USE_HE: "false"
      DP_EPSILON: "3.0"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/pure_dp:/results
      - ../../datasets/partitions:/datasets/partitions:ro
    depends_on:
      - fl_server_dp
    mem_limit: 700m
    memswap_limit: 700m
    cpus: "1.0"

  fl_client_dp_1:
    profiles: ["pure_dp"]
    image: fl-ids:latest
    container_name: fl_client_dp_1
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "1"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_dp:5000"
      USE_LOCAL_DP: "true"
      USE_ZKP: "false"
      USE_HE: "false"
      DP_EPSILON: "3.0"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/pure_dp:/results
      - ../../datasets/partitions:/datasets/partitions:ro
    depends_on:
      - fl_server_dp
    mem_limit: 700m
    memswap_limit: 700m
    cpus: "1.0"

  # ══════════════════════════════════════════════════════════════════
  # PURE HE — FULL COVERAGE: 100% of model encrypted
  # ══════════════════════════════════════════════════════════════════

  fl_server_he_full:
    profiles: ["he_full"]
    build: .
    image: fl-ids:latest
    container_name: fl_server_he_full
    command: ["python", "server.py"]
    environment:
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      USE_HE: "true"
      MODEL_TYPE: "network"
      NUM_FEATURES: "38"
    ports:
      - "5003:5000"
    volumes:
      - ./results/he_full:/results
    mem_limit: 2g

  fl_client_he_full_0:
    profiles: ["he_full"]
    image: fl-ids:latest
    container_name: fl_client_he_full_0
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "0"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_he_full:5000"
      USE_LOCAL_DP: "false"
      USE_ZKP: "false"
      USE_HE: "true"
      HE_FULL_COVERAGE: "true"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/he_full:/results
      - ../../datasets/partitions:/datasets/partitions:ro
    depends_on:
      - fl_server_he_full
    mem_limit: 500m
    memswap_limit: 500m
    cpus: "1.0"

  fl_client_he_full_1:
    profiles: ["he_full"]
    image: fl-ids:latest
    container_name: fl_client_he_full_1
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "1"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_he_full:5000"
      USE_LOCAL_DP: "false"
      USE_ZKP: "false"
      USE_HE: "true"
      HE_FULL_COVERAGE: "true"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/he_full:/results
      - ../../datasets/partitions:/datasets/partitions:ro
    depends_on:
      - fl_server_he_full
    mem_limit: 500m
    memswap_limit: 500m
    cpus: "1.0"

  # ══════════════════════════════════════════════════════════════════
  # PURE HE — PARTIAL: classifier head only (~6% of params)
  # ══════════════════════════════════════════════════════════════════

  fl_server_he_partial:
