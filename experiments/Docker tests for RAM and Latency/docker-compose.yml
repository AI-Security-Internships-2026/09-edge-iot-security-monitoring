version: "3.8"

services:

  # ══════════════════════════════════════════════════════════════════
  # PURE HE condition: 100% of model encrypted, DP+ZKP off
  # ══════════════════════════════════════════════════════════════════

  fl_server_he:
    profiles: ["pure_he"]
    build: .
    image: fl-ids:latest
    container_name: fl_server_he
    command: ["python", "server.py"]
    environment:
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      USE_HE: "true"
      MODEL_TYPE: "network"
    ports:
      - "5001:5000"
    volumes:
      - ./results/pure_he:/results
    mem_limit: 3g

  fl_client_he_0:
    profiles: ["pure_he"]
    image: fl-ids:latest
    container_name: fl_client_he_0
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "0"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_he:5000"
      USE_LOCAL_DP: "false"
      USE_ZKP: "false"
      USE_HE: "true"
      HE_FULL_COVERAGE: "true"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/pure_he:/results          # (existing, per service)
      - ../datasets/partitions:/datasets/partitions:ro   # (existing)
      - ../src/defences:/app/defences:ro    # NEW — canonical defences, read-only
    depends_on:
      - fl_server_he
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: "0.5"

  fl_client_he_1:
    profiles: ["pure_he"]
    image: fl-ids:latest
    container_name: fl_client_he_1
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "1"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_he:5000"
      USE_LOCAL_DP: "false"
      USE_ZKP: "false"
      USE_HE: "true"
      HE_FULL_COVERAGE: "true"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/pure_he:/results          # (existing, per service)
      - ../datasets/partitions:/datasets/partitions:ro   # (existing)
      - ../src/defences:/app/defences:ro    # NEW — canonical defences, read-only
    depends_on:
      - fl_server_he
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: "0.5"

  # ══════════════════════════════════════════════════════════════════
  # PURE DP condition: 100% of model DP-noised, HE+ZKP off
  # ══════════════════════════════════════════════════════════════════

  fl_server_dp:
    profiles: ["pure_dp"]
    build: .
    image: fl-ids:latest
    container_name: fl_server_dp
    command: ["python", "server.py"]
    environment:
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      USE_HE: "false"
      MODEL_TYPE: "network"
    ports:
      - "5002:5000"
    volumes:
      - ./results/pure_dp:/results
    mem_limit: 2g

  fl_client_dp_0:
    profiles: ["pure_dp"]
    image: fl-ids:latest
    container_name: fl_client_dp_0
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "0"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_dp:5000"
      USE_LOCAL_DP: "true"
      USE_ZKP: "false"
      USE_HE: "false"
      DP_EPSILON: "3.0"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/pure_dp:/results          # (existing, per service)
      - ../datasets/partitions:/datasets/partitions:ro   # (existing)
      - ../src/defences:/app/defences:ro    # NEW — canonical defences, read-only
    depends_on:
      - fl_server_dp
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: "0.5"

  fl_client_dp_1:
    profiles: ["pure_dp"]
    image: fl-ids:latest
    container_name: fl_client_dp_1
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "1"
      NUM_CLIENTS: "2"
      NUM_ROUNDS: "3"
      LOCAL_EPOCHS: "2"
      SERVER_URL: "http://fl_server_dp:5000"
      USE_LOCAL_DP: "true"
      USE_ZKP: "false"
      USE_HE: "false"
      DP_EPSILON: "3.0"
      MODEL_TYPE: "network"
      PARTITION_DIR: "/datasets/partitions"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./results/pure_he:/results          # (existing, per service)
      - ../datasets/partitions:/datasets/partitions:ro   # (existing)
      - ../src/defences:/app/defences:ro    # NEW — canonical defences, read-only
    depends_on:
      - fl_server_dp
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: "0.5"